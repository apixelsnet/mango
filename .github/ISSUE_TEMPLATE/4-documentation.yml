name: Documentation
description: Something in the README or the docs is wrong, missing or unclear.
title: "[Docs]: "
labels: ["documentation", "status: needs triage"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: A link to the page or section.
      placeholder: https://github.com/apixelsnet/mango/blob/main/docs/features/05-reader.md
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
      description: A suggested wording, if you have one.
