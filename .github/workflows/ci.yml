name: CI

# Checks every push to the main branch and every pull request: the UI type-checks
# and builds, the core's tests and lints pass with that UI built in, the UI's main paths
# work in Chromium and Firefox against a stand-in API, the extension host compiles, the
# desktop shell compiles, Rust code is formatted, and no dependency has a known serious
# advisory. Pushes to main also build and start the image on amd64 and arm64.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: UI and core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mango-reader/ui/package-lock.json

      - name: Check and build the UI
        working-directory: mango-reader/ui
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mango-reader/target
          key: cargo-${{ runner.os }}-${{ hashFiles('mango-reader/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test the core
        working-directory: mango-reader
        run: cargo test --release --locked

      # Long types are the code's style; every other lint is an error.
      - name: Lint the core
        working-directory: mango-reader
        run: cargo clippy --release --locked --all-targets -- -D warnings -A clippy::type_complexity

      - name: Format of the core
        working-directory: mango-reader
        run: cargo fmt --check

  browser:
    name: UI in a browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mango-reader/ui/package-lock.json

      - name: Install the UI and Chromium
        working-directory: mango-reader/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox

      # The built UI against a stand-in API (e2e/mock.mjs), at a desktop and a phone size.
      - name: Smoke test
        working-directory: mango-reader/ui
        run: npm run e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: mango-reader/ui/test-results/
          retention-days: 7

  host:
    name: Extension host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      # The host's jars, as the release image builds them: the runtime at its pinned version
      # and hash, the host compiled against it.
      - name: Build the host
        run: docker buildx build --target jars --output type=local,dest=/tmp/jars .

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: The UI's packages
        working-directory: mango-reader/ui
        run: npm audit --audit-level=high

      - name: The core's and the shell's crates
        run: |
          cargo install cargo-audit --locked
          # RUSTSEC-2023-0071: rsa only checks extensions' signatures, with public keys; the
          # timing attack is on decryption with a private key, which Mango never does.
          # RUSTSEC-2026-0387: crypto-bigint comes with p256, which signs Web Push messages;
          # no release of p256 takes the fixed version yet.
          cargo audit --file mango-reader/Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387
          cargo audit --file mango-desktop/Cargo.lock

  shell:
    name: Desktop shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      - name: Install what the shell links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mango-desktop/target
          key: shell-${{ runner.os }}-${{ hashFiles('mango-desktop/Cargo.lock') }}
          restore-keys: shell-${{ runner.os }}-

      - name: Check the shell
        working-directory: mango-desktop
        run: |
          cargo fmt --check
          cargo check --locked

  # The image as it ships, built and started on each processor it ships for, the arm64 one
  # on an arm64 machine rather than emulated. With the repository variables
  # MANGO_SMOKE_STORE, MANGO_SMOKE_STORE_LINK and MANGO_SMOKE_PKG set, smoke.py then runs
  # against a real store and extension; without them, only the start is checked. Not on
  # pull requests: it takes about as long as a release build.
  image:
    name: Image on ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --target mango --tag mango:ci .

      - name: Start it
        run: |
          docker run -d --name mango -p 127.0.0.1:8787:8787 -e MANGO_PASSWORD=smoke-test-password -e MANGO_HOST_IDLE_SECS=10 mango:ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8787/api/health && break; sleep 2; done
          docker exec mango mango version
          uname -m

      - name: Smoke test against a real store
        if: vars.MANGO_SMOKE_STORE != ''
        env:
          MANGO_SMOKE_STORE: ${{ vars.MANGO_SMOKE_STORE }}
          MANGO_SMOKE_STORE_LINK: ${{ vars.MANGO_SMOKE_STORE_LINK }}
          MANGO_SMOKE_PKG: ${{ vars.MANGO_SMOKE_PKG }}
        run: python3 mango-reader/smoke.py http://127.0.0.1:8787

      - name: The log of a failed run
        if: failure()
        run: docker logs mango
