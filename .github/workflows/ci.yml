name: CI

# Checks every push to the main branch and every pull request: the UI type-checks
# and builds, the core's tests and lints pass with that UI built in, the UI's main paths
# work in Chromium and Firefox against a stand-in API, the extension host compiles, the
# desktop shell compiles, and no dependency has a known serious advisory.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: UI and core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mango-reader/ui/package-lock.json

      - name: Check and build the UI
        working-directory: mango-reader/ui
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mango-reader/target
          key: cargo-${{ runner.os }}-${{ hashFiles('mango-reader/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test the core
        working-directory: mango-reader
        run: cargo test --release --locked

      # Long types are the code's style; every other lint is an error.
      - name: Lint the core
        working-directory: mango-reader
        run: cargo clippy --release --locked --all-targets -- -D warnings -A clippy::type_complexity

  browser:
    name: UI in a browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mango-reader/ui/package-lock.json

      - name: Install the UI and Chromium
        working-directory: mango-reader/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox

      # The built UI against a stand-in API (e2e/mock.mjs), at a desktop and a phone size.
      - name: Smoke test
        working-directory: mango-reader/ui
        run: npm run e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: mango-reader/ui/test-results/
          retention-days: 7

  host:
    name: Extension host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      # The host's jars, as the release image builds them: the runtime at its pinned version
      # and hash, the host compiled against it.
      - name: Build the host
        run: docker buildx build --target jars --output type=local,dest=/tmp/jars .

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: The UI's packages
        working-directory: mango-reader/ui
        run: npm audit --audit-level=high

      - name: The core's and the shell's crates
        run: |
          cargo install cargo-audit --locked
          # RUSTSEC-2023-0071: rsa only checks extensions' signatures, with public keys; the
          # timing attack is on decryption with a private key, which Mango never does.
          # RUSTSEC-2026-0387: crypto-bigint comes with p256, which signs Web Push messages;
          # no release of p256 takes the fixed version yet.
          cargo audit --file mango-reader/Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387
          cargo audit --file mango-desktop/Cargo.lock

  shell:
    name: Desktop shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false

      - name: Install what the shell links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mango-desktop/target
          key: shell-${{ runner.os }}-${{ hashFiles('mango-desktop/Cargo.lock') }}
          restore-keys: shell-${{ runner.os }}-

      - name: Check the shell
        working-directory: mango-desktop
        run: cargo check --locked
