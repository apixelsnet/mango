name: Labels

# Makes the repository's labels match .github/labels.yml: every label there is
# created if it is missing and has its colour and description set. Labels that
# are not in the file are left as they are. Runs when the file changes on the main
# branch, and by hand from the Actions tab.

on:
  push:
    branches: [main, master]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

concurrency:
  group: labels
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false

      - name: Create and update the labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          yq -o=json '.' .github/labels.yml | jq -c '.[]' | while IFS= read -r label; do
            name=$(jq -r '.name' <<<"$label")
            color=$(jq -r '.color' <<<"$label")
            description=$(jq -r '.description // ""' <<<"$label")
            # --force updates a label that already exists instead of failing.
            gh label create "$name" --color "$color" --description "$description" --force
            echo "synced: $name"
          done
