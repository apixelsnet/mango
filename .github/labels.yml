- name: "area: ci"
  color: bfdadc
  description: Workflows and releases

# How it ended, when it did not end in a change.
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: invalid
  color: e4e669
  description: This doesn't seem right
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: upstream
  color: c5def5
  description: The cause is in an extension, Suwayomi-Server or another project

# For people who want to help.
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: 008672
  description: Extra attention is needed
